<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="デスクスクリーン"><meta name="theme-color" content="#12151c"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><title>デスクスクリーン</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923}#deskFrame{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block;background:#101923}</style></head><body><iframe id="deskFrame" title="デスクスクリーン" src="./screen.html"></iframe><script>
const frame=document.getElementById('deskFrame');let direction=-1;
function frameLayout(width,height,mode){
 const naturalPortrait=height>=width;
 const rotate=mode!==-1&&((mode===1)!==naturalPortrait);
 return {width:rotate?height:width,height:rotate?width:height,rotate:rotate};
}
function placeFrame(){
 const width=document.documentElement.clientWidth||innerWidth,height=document.documentElement.clientHeight||innerHeight;
 const layout=frameLayout(width,height,direction);
 frame.width=layout.width;frame.height=layout.height;frame.style.width=layout.width+'px';frame.style.height=layout.height+'px';
 frame.style.transform=layout.rotate?'translateX('+width+'px) rotate(90deg)':'none';
 requestAnimationFrame(function(){frame.contentWindow.postMessage({type:'DESK_ORIENTATION_STATE',mode:direction},location.origin);});
}
window.addEventListener('message',function(event){
 if(event.origin!==location.origin||event.source!==frame.contentWindow||!event.data)return;
 if(event.data.type==='DESK_ORIENTATION'&&[-1,0,1].includes(event.data.mode)){direction=event.data.mode;placeFrame();}
 else if(event.data.type==='DESK_READY')placeFrame();
});
frame.addEventListener('load',placeFrame);window.addEventListener('resize',placeFrame);
if(window.visualViewport)window.visualViewport.addEventListener('resize',placeFrame);
placeFrame();
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});
</script></body></html>
